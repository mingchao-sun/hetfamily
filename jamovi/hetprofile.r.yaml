---
name: hetprofile
title: 'Effect Profile (CATE regression)'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: fit
      title: 'How well each learner predicts the effects'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, moderators, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, nsplit, shareMain, level, vcov, lambdaRule, seed]
      columns:
        - name: learner
          title: 'Learner'
          type: text
        - name: lam
          title: 'Lambda (BLP)'
          type: number
        - name: lamb
          title: 'Lambda-bar (GATES)'
          type: number
        - name: bg
          title: 'Used for the profile'
          type: text

    - name: prof
      title: 'Effect of the treatment and how it changes with each moderator (per standard deviation)'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, moderators, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, nsplit, shareMain, level, vcov, lambdaRule, seed]
      columns:
        - name: what
          title: ''
          type: text
        - name: est
          title: 'Estimate'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: profPlot
      title: 'Change of the effect per standard deviation of each moderator'
      type: Image
      width: 560
      height: 420
      renderFun: .plotProf
      visible: (plot)
      clearWith: [outcome, treat, control, armTreat, covs, moderators, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, nsplit, shareMain, level, vcov, lambdaRule, seed]

refs:
    - semenova2021
    - cddf2018

...
