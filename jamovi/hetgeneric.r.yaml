---
name: hetgeneric
title: 'Heterogeneous Effects (BLP, GATES, CLAN)'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: fit
      title: 'How well each learner predicts the effects'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, groups, nsplit, shareMain, level, vcov, lambdaRule, monotonize, seed]
      columns:
        - name: learner
          title: 'Learner'
          type: text
        - name: lam
          title: 'Lambda (BLP)'
          type: number
        - name: lamb
          title: 'Lambda-bar (GATES)'
          type: number
        - name: bb
          title: 'Best for BLP'
          type: text
        - name: bg
          title: 'Best for GATES and CLAN'
          type: text

    - name: blp
      title: 'Best linear predictor of the effects'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, groups, nsplit, shareMain, level, vcov, lambdaRule, monotonize, seed]
      columns:
        - name: what
          title: ''
          type: text
        - name: est
          title: 'Estimate'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: gates
      title: 'Average effect by group of predicted effect (GATES)'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, groups, nsplit, shareMain, level, vcov, lambdaRule, monotonize, seed]
      columns:
        - name: what
          title: 'Group'
          type: text
        - name: est
          title: 'Estimate'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: clan
      title: 'Who is affected most: covariate means (CLAN)'
      type: Table
      rows: 0
      visible: (clan)
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, groups, nsplit, shareMain, level, vcov, lambdaRule, monotonize, seed, clan]
      columns:
        - name: what
          title: 'Covariate'
          type: text
        - name: m1
          title: 'Least affected'
          type: number
        - name: m2
          title: 'Most affected'
          type: number
        - name: est
          title: 'Difference'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: gatesPlot
      title: 'Average effect by group'
      type: Image
      width: 560
      height: 360
      renderFun: .plotGates
      visible: (plot)
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, groups, nsplit, shareMain, level, vcov, lambdaRule, monotonize, seed]

refs:
    - cddf2018
    - genericml

...
