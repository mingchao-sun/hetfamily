---
name: hetpolicy
title: 'Treatment Rule Value'
jas: '1.2'
version: '1.0.0'
menuGroup: Heterogeneity
menuTitle: 'Treatment Rule'
menuSubtitle: 'Value of treating the units with the largest predicted effect'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: armTreat
      title: 'Treatment group value (blank = the second)'
      type: String
      default: ''

    - name: covs
      title: 'Covariates'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: prop
      title: 'Known propensity score (optional)'
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: lrnLasso
      title: 'Lasso'
      type: Bool
      default: true

    - name: lrnRidge
      title: 'Ridge'
      type: Bool
      default: false

    - name: lrnEnet
      title: 'Elastic net'
      type: Bool
      default: false

    - name: lrnRf
      title: 'Random forest'
      type: Bool
      default: false

    - name: lrnOls
      title: 'Linear regression'
      type: Bool
      default: false

    - name: cost
      title: 'Cost of treating a unit (outcome units)'
      type: Number
      default: 0

    - name: nsplit
      title: 'Number of sample splits'
      type: Integer
      default: 50
      min: 5
      max: 500

    - name: shareMain
      title: 'Share of the sample used for estimation'
      type: Number
      default: 0.5
      min: 0.2
      max: 0.8

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: lambdaRule
      title: 'Lasso and ridge penalty'
      type: List
      options:
          - name: min
            title: 'Cross-validation minimum'
          - name: 1se
            title: 'One standard error above the minimum'
      default: min

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
