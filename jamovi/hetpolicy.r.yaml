---
name: hetpolicy
title: 'Treatment Rule Value'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: fit
      title: 'How well each learner predicts the effects'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, cost, nsplit, shareMain, level, lambdaRule, seed]
      columns:
        - name: learner
          title: 'Learner'
          type: text
        - name: lam
          title: 'Lambda (BLP)'
          type: number
        - name: lamb
          title: 'Lambda-bar (GATES)'
          type: number
        - name: bg
          title: 'Used for the rule'
          type: text

    - name: val
      title: 'Value of the rule: treat a unit if its predicted effect exceeds the cost'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, armTreat, covs, prop, lrnLasso, lrnRidge, lrnEnet, lrnRf, lrnOls, cost, nsplit, shareMain, level, lambdaRule, seed]
      columns:
        - name: what
          title: ''
          type: text
        - name: est
          title: 'Estimate'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

refs:
